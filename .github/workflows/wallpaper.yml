name: Denní tapeta

on:
  schedule:
    # GitHub Actions schedule triggers are best-effort and can be delayed by
    # hours (or dropped entirely) under platform load, so we run twice:
    # a main nightly slot and a backup a few hours later. The "already
    # published today?" check below makes the backup a no-op when the main
    # run actually succeeded (just late).
    - cron: "30 23 * * *"   # 23:30 UTC ≈ 01:30 (CEST) / 00:30 (CET) v Praze — hlavní běh
    - cron: "30 5 * * *"    # 05:30 UTC ≈ 07:30 (CEST) / 06:30 (CET) v Praze — záložní běh
  workflow_dispatch: {}     # tlačítko pro ruční spuštění

permissions:
  contents: write

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The publish step below amends the previous wallpaper commit and
          # force-pushes it. actions/checkout defaults to fetch-depth: 1, and
          # amending the tip of a shallow clone produces a commit rooted at the
          # shallow boundary — force-pushing that REPLACES main with a
          # single-commit history and throws away all the source history.
          # Full history is required for the amend to keep a real parent.
          fetch-depth: 0

      - name: Check if today's wallpaper is already published
        id: check
        run: |
          # Keyed on the Prague date, NOT UTC. The 23:30 UTC run happens at
          # 00:30/01:30 Prague, i.e. it generates the *next* Prague day's
          # wallpaper — which is also the date the image itself renders. Keying
          # on the UTC date made that run collide with the backup run that had
          # already published earlier the same UTC day, so the night slot was
          # always skipped and every wallpaper landed at 07:30 Prague instead.
          TODAY=$(TZ=Europe/Prague date +%F)
          if git log -20 --format=%s | grep -qx "tapeta $TODAY"; then
            echo "Already published for $TODAY, skipping."
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.already != 'true'
        with:
          node-version: 20

      - name: Install Playwright
        if: steps.check.outputs.already != 'true'
        run: |
          npm init -y > /dev/null
          npm i playwright
          npx playwright install --with-deps chromium

      - name: Render wallpapers
        if: steps.check.outputs.already != 'true'
        run: node scripts/snap.mjs
        env:
          # sem patří vaše preferované parametry vzhledu
          PAGE_URL: "https://linhavo.github.io/slovo-dne/?ui=0&bg=solid&pool=cizi"

      - name: Commit & push
        if: steps.check.outputs.already != 'true'
        run: |
          git config user.name "tapeta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wallpaper-light.png wallpaper-dark.png wallpaper-mac-light.png wallpaper-mac-dark.png word-history.json

          if git diff --cached --quiet; then
            echo "beze změny"
            exit 0
          fi

          # Same Prague date as the check step above, so the commit message
          # matches both the idempotency key and the date shown in the image.
          TODAY=$(TZ=Europe/Prague date +%F)
          BASE=$(git rev-parse HEAD)

          # If the previous commit was itself just a wallpaper publish, replace
          # it in place instead of stacking a new one — these images are fully
          # reconstructable from word-history.json, so there's no point letting
          # history grow by ~1MB every night. A real code change on top of
          # history still gets a normal commit.
          if [[ "$(git log -1 --format=%s)" == tapeta\ * ]]; then
            # Amending on a shallow clone would rewrite main down to a single
            # commit (see fetch-depth above) — bail out rather than destroy it.
            if [ -f .git/shallow ]; then
              echo "::error::Refusing to amend/force-push from a shallow clone (needs fetch-depth: 0)."
              exit 1
            fi
            git commit --amend -m "tapeta $TODAY"
            # Pin the lease to the exact commit we amended, so a push that
            # landed while this job ran makes this fail loudly instead of
            # clobbering it.
            git push --force-with-lease=main:"$BASE" origin HEAD:main
          else
            git commit -m "tapeta $TODAY"
            git push origin HEAD:main
          fi
