name: Denní tapeta

on:
  schedule:
    # GitHub Actions schedule triggers are best-effort and can be delayed by
    # hours (or dropped entirely) under platform load, so we run twice:
    # a main nightly slot and a backup a few hours later. The "already
    # published today?" check below makes the backup a no-op when the main
    # run actually succeeded (just late).
    - cron: "30 23 * * *"   # 23:30 UTC ≈ 01:30 (CEST) / 00:30 (CET) v Praze — hlavní běh
    - cron: "30 5 * * *"    # 05:30 UTC ≈ 07:30 (CEST) / 06:30 (CET) v Praze — záložní běh
  workflow_dispatch: {}     # tlačítko pro ruční spuštění

permissions:
  contents: write

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if today's wallpaper is already published
        id: check
        run: |
          TODAY=$(date -u +%F)
          if git log -20 --format=%s | grep -qx "tapeta $TODAY"; then
            echo "Already published for $TODAY, skipping."
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.already != 'true'
        with:
          node-version: 20

      - name: Install Playwright
        if: steps.check.outputs.already != 'true'
        run: |
          npm init -y > /dev/null
          npm i playwright
          npx playwright install --with-deps chromium

      - name: Render wallpapers
        if: steps.check.outputs.already != 'true'
        run: node scripts/snap.mjs
        env:
          # sem patří vaše preferované parametry vzhledu
          PAGE_URL: "https://linhavo.github.io/slovo-dne/?ui=0&bg=solid&pool=cizi"

      - name: Commit & push
        if: steps.check.outputs.already != 'true'
        run: |
          git config user.name "tapeta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wallpaper-light.png wallpaper-dark.png wallpaper-mac-light.png wallpaper-mac-dark.png word-history.json
          git commit -m "tapeta $(date -u +%F)" || echo "beze změny"
          git push
